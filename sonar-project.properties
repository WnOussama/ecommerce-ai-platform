# =============================================================================
# SonarCloud project configuration
# =============================================================================

sonar.organization=prodexo
sonar.projectKey=prodexo_cloud-digital-factory
sonar.projectName=SaaS AI E-commerce Platform

# Monorepo: analyze the Python backend, the Laravel backoffice, and the
# PrestaShop module in one scan.
sonar.sources=src/ai-core/app,src/backoffice/app,src/platform-adapters/prestashop/aiassistant
sonar.tests=src/ai-core/tests,src/backoffice/tests,src/platform-adapters/prestashop/aiassistant/tests

# sonar.sources and sonar.tests must be disjoint - the prestashop module's
# tests/ dir is only listed under sonar.tests, so exclude it here or Sonar
# fails with "can't be indexed twice".
sonar.exclusions=**/vendor/**,**/venv/**,**/.venv/**,**/node_modules/**,**/*.min.js,**/public/js/filament/**,**/public/css/filament/**,**/platform-adapters/prestashop/aiassistant/tests/**

sonar.python.version=3.11
sonar.python.coverage.reportPaths=src/ai-core/coverage.xml

sonar.sourceEncoding=UTF-8
