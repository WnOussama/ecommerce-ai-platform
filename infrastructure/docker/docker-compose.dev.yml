# =============================================================================
# DOCKER COMPOSE - SaaS AI E-commerce (Development)
#
# ARCHITECTURE:
# - PostgreSQL: Owned EXCLUSIVELY by FastAPI (AI Core)
# - Laravel Dashboard: Communicates via REST API only (NO direct DB access)
# - Migrations: Managed by Alembic (Python) only
# - Services: FastAPI + PostgreSQL + Redis + ChromaDB
# =============================================================================

services:
  # ===========================================================================
  # AI CORE - FastAPI Application
  # ===========================================================================
  ai-core:
    build:
      context: ../../src/ai-core
      dockerfile: ../../infrastructure/docker/services/ai-core.Dockerfile
      target: development
    container_name: saas_ai_core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - LLM_GROQ_API_KEY=${LLM_GROQ_API_KEY:-}
      - LLM_OPENAI_API_KEY=${LLM_OPENAI_API_KEY:-}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-saas_ecommerce}
      - DB_USER=${DB_USER:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../../src/ai-core:/app:cached
      - ai_core_logs:/app/logs
    networks:
      - saas_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ===========================================================================
  # BACKOFFICE - Laravel/Filament Admin Dashboard
  # REST client only - no direct database access (see header note above)
  # ===========================================================================
  backoffice:
    build:
      context: ../../src/backoffice
      dockerfile: ../../infrastructure/docker/services/backoffice.Dockerfile
      target: development
    container_name: saas_backoffice
    restart: unless-stopped
    environment:
      - APP_KEY=${BACKOFFICE_APP_KEY:?BACKOFFICE_APP_KEY is required}
      - DB_CONNECTION=sqlite
      - AICORE_API_URL=http://ai-core:8000/api/v1
      - AICORE_ROOT_URL=http://ai-core:8000
      - AICORE_TENANT_ID=${BACKOFFICE_TENANT_ID:-}
      - AICORE_API_KEY=${BACKOFFICE_API_KEY:-}
    ports:
      - "${BACKOFFICE_PORT:-8090}:8000"
    networks:
      - saas_network
    depends_on:
      ai-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ===========================================================================
  # DATABASE - PostgreSQL 16
  # Owner: FastAPI AI Core (EXCLUSIVE)
  # Access: FastAPI only - Laravel uses REST API
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-saas_ecommerce}
      POSTGRES_USER: ${DB_USER:-saas_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - saas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-saas_user} -d ${DB_NAME:-saas_ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ===========================================================================
  # PRESTASHOP DEMO STOREFRONT - real shop for the aiassistant module
  #
  # Separate from the ai-core/backoffice Postgres above: PrestaShop needs its
  # own MySQL. Not required for the core stack - only for demoing the
  # storefront widget (src/platform-adapters/prestashop/aiassistant).
  # ===========================================================================
  mysql:
    image: mysql:8.0
    container_name: saas_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${PS_DB_PASSWORD:?PS_DB_PASSWORD is required}
      MYSQL_DATABASE: ${PS_DB_NAME:-prestashop}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - saas_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${PS_DB_PASSWORD:?PS_DB_PASSWORD is required}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  prestashop:
    image: prestashop/prestashop:8-apache
    container_name: saas_prestashop
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_SERVER: mysql
      DB_NAME: ${PS_DB_NAME:-prestashop}
      DB_USER: root
      DB_PASSWD: ${PS_DB_PASSWORD:?PS_DB_PASSWORD is required}
      PS_DOMAIN: ${PS_DOMAIN:-localhost:8080}
      PS_INSTALL_AUTO: 1
      PS_ERASE_DB: 0
      PS_LANGUAGE: en
      PS_COUNTRY: GB
      # PS_DEV_MODE=1 forces PrestaShop's Symfony kernel into the 'dev'
      # environment, which needs var/cache/dev/appParameters.php - but the
      # auto-installer only ever builds the 'prod' cache (confirmed: install
      # log references appAppKernelProdContainer.php). With dev mode on,
      # any request that boots the Symfony side (module front controllers)
      # crashes with "Failed opening required .../var/cache/dev/
      # appParameters.php". Keep this at 0 to match the cache that actually
      # gets built; PHP errors are still visible via docker logs regardless.
      PS_DEV_MODE: 0
      ADMIN_MAIL: ${PS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWD: ${PS_ADMIN_PASSWORD:?PS_ADMIN_PASSWORD is required}
    ports:
      - "8080:80"
    volumes:
      - prestashop_data:/var/www/html
      - ../../src/platform-adapters/prestashop/aiassistant:/var/www/html/modules/aiassistant
      # aiassistant/vendor/ ships PHPUnit's dev-only deps (incl. nikic/php-parser)
      # for the module's own test suite - never required at runtime (verified: no
      # `require vendor/autoload.php` anywhere in aiassistant.php/classes/
      # controllers/). Left mounted, its php-parser collides with PrestaShop
      # core's own copy and crashes `prestashop:module install` with
      # "Call to undefined method PhpParser\ParserFactory::create()". Shadow
      # it with an anonymous volume so PrestaShop's autoloader never sees it -
      # the host's vendor/ (used by `composer test` locally) is untouched.
      - /var/www/html/modules/aiassistant/vendor
    networks:
      - saas_network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  # ===========================================================================
  # CACHE & SESSION - Redis 7
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory 128mb 
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - saas_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ===========================================================================
  # VECTOR DATABASE - ChromaDB
  # ===========================================================================
  chromadb:
    image: chromadb/chroma:0.4.22
    container_name: saas_chromadb
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "${CHROMA_PORT:-8100}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - saas_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ===========================================================================
  # PROMETHEUS - Scrapes ai-core's real /metrics (see prometheus.dev.yml)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: saas_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - saas_network
    profiles:
      - monitoring

  # ===========================================================================
  # GRAFANA - auto-provisioned with the Prometheus datasource and the
  # existing AI observability dashboard (both were previously referenced
  # but never actually wired: the provisioning/ directory didn't exist)
  # ===========================================================================
  grafana:
    image: grafana/grafana:10.1.0
    container_name: saas_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - saas_network
    profiles:
      - monitoring

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  saas_network:
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  mysql_data:
    driver: local
  prestashop_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
  ai_core_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

