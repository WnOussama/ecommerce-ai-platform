# =============================================================================
# NGINX Configuration - Multi-Service AI SaaS
# Routes les requêtes vers les services appropriés
# =============================================================================

upstream chat_service {
    server ai-chat-service:8001;
    keepalive 32;
}

upstream admin_service {
    server ai-admin-service:8002;
    keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Request ID for tracing
    set $request_id $request_id;
    if ($http_x_request_id) {
        set $request_id $http_x_request_id;
    }
    add_header X-Request-ID $request_id always;

    # ==========================================================================
    # CHAT SERVICE ROUTES - Client-facing
    # /api/v1/chat, /api/v1/recommendations, /api/v1/coupons, /api/v1/faq
    # ==========================================================================

    location /api/v1/chat {
        limit_req zone=chat_limit burst=10 nodelay;

        proxy_pass http://chat_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # Timeouts optimisés pour chat (streaming possible)
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Buffer settings for SSE/streaming
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/v1/recommendations {
        limit_req zone=chat_limit burst=5 nodelay;

        proxy_pass http://chat_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /api/v1/coupons {
        limit_req zone=chat_limit burst=3 nodelay;

        proxy_pass http://chat_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
    }

    location /api/v1/faq {
        limit_req zone=chat_limit burst=10 nodelay;

        proxy_pass http://chat_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ==========================================================================
    # ADMIN SERVICE ROUTES - Admin-facing
    # /api/v1/admin, /api/v1/analytics, /api/v1/tenants, /api/v1/operations
    # ==========================================================================

    location /api/v1/admin {
        limit_req zone=admin_limit burst=5 nodelay;

        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # Timeouts plus longs pour opérations admin
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    location /api/v1/analytics {
        limit_req zone=admin_limit burst=10 nodelay;

        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /api/v1/tenants {
        limit_req zone=admin_limit burst=5 nodelay;

        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /api/v1/operations {
        limit_req zone=admin_limit burst=5 nodelay;

        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ==========================================================================
    # HEALTH CHECKS
    # ==========================================================================

    location /health/chat {
        proxy_pass http://chat_service/health;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /health/admin {
        proxy_pass http://admin_service/health;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /health {
        return 200 '{"status": "healthy", "services": ["chat", "admin", "sync"]}';
        add_header Content-Type application/json;
    }

    # ==========================================================================
    # METRICS (internal only)
    # ==========================================================================

    location /metrics/chat {
        # Restrict to internal network
        allow 172.28.0.0/16;
        deny all;

        proxy_pass http://chat_service/metrics;
        proxy_http_version 1.1;
    }

    location /metrics/admin {
        allow 172.28.0.0/16;
        deny all;

        proxy_pass http://admin_service/metrics;
        proxy_http_version 1.1;
    }

    # ==========================================================================
    # DEFAULT
    # ==========================================================================

    location / {
        return 404 '{"error": "not_found", "message": "Endpoint not found"}';
        add_header Content-Type application/json;
    }
}

