# =============================================================================
# CI Pipeline — AI Core Backend
# Runs: lint, type-check, tests with coverage, Docker build
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]

env:
  PYTHON_VERSION: "3.11"
  WORKING_DIR: ./src/ai-core
  LLM_PROVIDER: mock
  DB_PASSWORD: ci_test_password_123
  SECURITY_JWT_SECRET_KEY: ci_jwt_secret_key_minimum_32_characters_long

jobs:
  # ===========================================================================
  # LINT & FORMAT CHECK
  # ===========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff check
        working-directory: ${{ env.WORKING_DIR }}
        run: ruff check app/ --output-format=github

      - name: Ruff format check
        working-directory: ${{ env.WORKING_DIR }}
        run: ruff format --check app/

  # ===========================================================================
  # UNIT & INTEGRATION TESTS
  # ===========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.WORKING_DIR }}/requirements*.txt

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          python -m pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml \
            -v \
            --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.WORKING_DIR }}/coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.WORKING_DIR }}/junit.xml

  # ===========================================================================
  # DOCKER BUILD (no push)
  # ===========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (production target)
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          file: ./infrastructure/docker/services/ai-core.Dockerfile
          target: production
          push: false
          tags: ai-core:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

