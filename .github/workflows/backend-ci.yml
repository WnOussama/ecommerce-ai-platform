# =============================================================================
# Backend CI Pipeline - AI Core Service
#
# Triggers: Push/PR to main, develop, feat/* branches
# Jobs: Lint → Test → Build
# Target: < 5 minutes
# =============================================================================

name: Backend CI

on:
  push:
    branches: [main, develop, 'feat/**']
    paths:
      - 'src/ai-core/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/ai-core/**'

env:
  PYTHON_VERSION: '3.11'
  WORKING_DIR: ./src/ai-core

jobs:
  # ===========================================================================
  # LINT & FORMAT CHECK
  # ===========================================================================
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('src/ai-core/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      - name: Install linting tools
        run: pip install ruff black mypy

      - name: Run Ruff (linter)
        working-directory: ${{ env.WORKING_DIR }}
        run: ruff check app/ --output-format=github
        continue-on-error: true

      - name: Run Black (format check)
        working-directory: ${{ env.WORKING_DIR }}
        run: black --check --diff app/
        continue-on-error: true

      - name: Run MyPy (type check)
        working-directory: ${{ env.WORKING_DIR }}
        run: mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  # ===========================================================================
  # UNIT TESTS
  # ===========================================================================
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      # Application settings
      ENVIRONMENT: test
      LLM_PROVIDER: mock

      # Database settings
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password_123

      # Redis settings
      REDIS_HOST: localhost
      REDIS_PORT: 6379

      # Security settings
      SECURITY_JWT_SECRET_KEY: test_jwt_secret_key_32_characters_minimum_for_ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('src/ai-core/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run database migrations
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          alembic upgrade head
        continue-on-error: true

      - name: Run unit tests
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=junit.xml \
            -x

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ${{ env.WORKING_DIR }}/coverage.xml
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ env.WORKING_DIR }}/junit.xml
          retention-days: 7

  # ===========================================================================
  # DOCKER BUILD
  # ===========================================================================
  build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          file: infrastructure/docker/services/ai-core.Dockerfile
          push: false
          tags: ai-core:${{ github.sha }}
          target: production
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Prevent cache from growing indefinitely
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ===========================================================================
  # SUMMARY
  # ===========================================================================
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: success()
    steps:
      - name: CI passed
        run: echo "All CI checks passed successfully!"

