# =============================================================================
# Backend CI Pipeline - AI Core Service (FastAPI)
#
# This is the single CI pipeline for src/ai-core - it replaces two
# previously-overlapping workflows (both fired on every push, building the
# same image twice) plus infrastructure/ci-cd/github-actions.yml, which was
# never executed at all (GitHub Actions only reads .github/workflows/) and
# was the only place security scanning existed. Both are now removed; their
# useful parts (Trivy + Bandit) are ported into the security-scan job below.
#
# Jobs: Lint -> Test (real Postgres + Redis) -> Security scan -> Docker build
# =============================================================================

name: Backend CI

on:
  push:
    branches: [main, dev, 'feat/**']
    paths:
      - 'src/ai-core/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/ai-core/**'

env:
  PYTHON_VERSION: '3.11'
  WORKING_DIR: ./src/ai-core

jobs:
  # ===========================================================================
  # LINT & FORMAT CHECK
  # ===========================================================================
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('src/ai-core/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      - name: Install linting tools
        run: pip install ruff

      - name: Run Ruff (linter)
        working-directory: ${{ env.WORKING_DIR }}
        run: ruff check app/ --output-format=github

      - name: Run Ruff (format check)
        working-directory: ${{ env.WORKING_DIR }}
        run: ruff format --check app/

  # ===========================================================================
  # TESTS - real PostgreSQL + Redis, matching the actual dev/prod stack
  # (the previous dead workflow used mysql:8.0 here, contradicting every
  # other part of the project - docker-compose, k8s manifests, and this
  # workflow's sibling test job all use PostgreSQL)
  # ===========================================================================
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      ENVIRONMENT: test
      LLM_PROVIDER: mock
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password_123
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECURITY_JWT_SECRET_KEY: test_jwt_secret_key_32_characters_minimum_for_ci
      SECURITY_API_KEY_ENCRYPTION_KEY: test_api_key_encryption_32_chars_minimum_for_ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('src/ai-core/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run database migrations
        working-directory: ${{ env.WORKING_DIR }}
        run: alembic upgrade head

      - name: Run tests with coverage
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=junit.xml \
            -v \
            --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.WORKING_DIR }}/coverage.xml
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.WORKING_DIR }}/junit.xml
          retention-days: 7

  # ===========================================================================
  # SECURITY SCAN (ported from infrastructure/ci-cd/github-actions.yml,
  # which never actually ran - this is the first time these checks execute)
  # ===========================================================================
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'src/ai-core'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # trivyignores is resolved relative to the repo root, not
          # scan-ref - without this, src/ai-core/.trivyignore (verified
          # server-only ChromaDB CVEs unreachable via this app's embedded
          # PersistentClient usage - see that file) was silently ignored.
          trivyignores: 'src/ai-core/.trivyignore'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (Python security linter)
        working-directory: ${{ env.WORKING_DIR }}
        run: bandit -r app/ -ll -ii

  # ===========================================================================
  # DOCKER BUILD - pushes to GitHub Container Registry on push to main/dev
  # (not on PRs). ghcr.io over Docker Hub: no extra account, no anonymous
  # pull-rate limits to worry about mid-demo, and it rides on the repo's
  # existing GitHub auth via GITHUB_TOKEN.
  # ===========================================================================
  build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    # sentence-transformers pulls in torch; a cold GHA layer cache has taken
    # up to ~68min to download it before, 10min was never realistic.
    timeout-minutes: 30
    needs: [test, security-scan]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io requires lowercase image names, but github.repository
      # preserves the owner's actual case (WnOussama/...) - lowercase it here
      # rather than inline, since Actions expressions have no case function.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/ai-core" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          file: infrastructure/docker/services/ai-core.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # SUMMARY
  # ===========================================================================
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan, build]
    if: success()
    steps:
      - name: CI passed
        run: echo "All backend CI checks passed successfully!"
