# =============================================================================
# Backoffice CI Pipeline - Laravel/Filament Admin Dashboard
#
# Triggers: Push/PR to main, develop, feat/* branches
# Jobs: Lint → Test → Build
# =============================================================================

name: Backoffice CI

on:
  push:
    branches: [main, dev, 'feat/**']
    paths:
      - 'src/backoffice/**'
      - '.github/workflows/backoffice-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/backoffice/**'

env:
  PHP_VERSION: '8.4'
  WORKING_DIR: ./src/backoffice

jobs:
  # ===========================================================================
  # LINT (Laravel Pint)
  # ===========================================================================
  lint:
    name: 🔍 Lint (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: intl, pdo_sqlite, mbstring
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('src/backoffice/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint (format check)
        working-directory: ${{ env.WORKING_DIR }}
        run: vendor/bin/pint --test

  # ===========================================================================
  # UNIT / FEATURE TESTS (PHPUnit)
  # ===========================================================================
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    env:
      APP_ENV: testing
      APP_KEY: base64:0pPMewhzj1DHpts07RFutWa6BmDRpd88qq29GMc/z7Q=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: intl, pdo_sqlite, mbstring
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('src/backoffice/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        working-directory: ${{ env.WORKING_DIR }}
        run: php artisan test

  # ===========================================================================
  # SECURITY SCAN
  # ===========================================================================
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: intl, pdo_sqlite, mbstring
          coverage: none

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: composer install --no-interaction --prefer-dist

      # skip-dirs excludes vendor/ - third-party packages sometimes bundle
      # their own docs-build requirements.txt (e.g. mockery/docs) which
      # aren't part of this project's actual dependency surface
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: ${{ env.WORKING_DIR }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          skip-dirs: 'vendor'

  # ===========================================================================
  # DOCKER BUILD
  # ===========================================================================
  build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, security-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-backoffice
          key: ${{ runner.os }}-buildx-backoffice-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-backoffice-

      # NOTE: only a "development" stage exists today (php artisan serve).
      # A hardened php-fpm + nginx "production" stage is not yet built -
      # see infrastructure/docker/services/backoffice.Dockerfile.
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          file: infrastructure/docker/services/backoffice.Dockerfile
          push: false
          tags: backoffice:${{ github.sha }}
          target: development
          cache-from: type=local,src=/tmp/.buildx-cache-backoffice
          cache-to: type=local,dest=/tmp/.buildx-cache-backoffice-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache-backoffice
          mv /tmp/.buildx-cache-backoffice-new /tmp/.buildx-cache-backoffice

  # ===========================================================================
  # SUMMARY
  # ===========================================================================
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan, build]
    if: success()
    steps:
      - name: CI passed
        run: echo "All backoffice CI checks passed successfully!"
